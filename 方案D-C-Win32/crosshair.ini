; ============================================================
;  屏幕准星配置文件（圆点样式）
;  修改后保存，按 Ctrl+Alt+I 热键重新加载（无需重启程序）
;  ------------------------------------------------------------
;  注意：size 不要填 0，最小值会被钳到 1，红点会小到看不见。
; ============================================================

[crosshair]
; 红点直径（像素）。建议 3 - 30
size=8
; 以下两项为旧十字样式的参数，圆点模式不使用，保留仅为兼容
thickness=2
gap=0
; 颜色（红 绿 蓝，0-255）。默认纯红
colorR=255
colorG=0
colorB=0
; 整体不透明度 0-255，255 = 完全不透明
opacity=230
; 以下两项为旧的中心点参数，圆点模式不使用，保留仅为兼容
centerDot=0
dotSize=3
; 是否给红点加黑色描边 0/1。加了亮背景下更清晰，但红点显小
outline=0
; 显示器序号：0 = 主显示器，1 = 第二块，以此类推
monitor=0
